[package]
name = "ntfy-desktop"
version = "2.2.2"
description = "Ntfy.sh desktop client for Windows, Linux, and MacOS with push notifications. Supports official ntfy.sh website and self-hosted instances."
authors = ["pol4rfuchs"]
license = "GPL-3.0-or-later"
repository = "https://github.com/pol4rfuchs/ntfy-desktop"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ntfy_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "ntfy-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "rt", "macros"] }
chrono = "0.4"
notify-rust = "4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
dirs = "5"
url = "2"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
# click handling for toasts (same crate notify-rust uses on Windows)
tauri-winrt-notification = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
