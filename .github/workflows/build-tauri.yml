name: '🦀 Build Tauri (Rust)'
run-name: '🦀 Build Tauri (Rust)'

on:
    workflow_dispatch:
    pull_request:
        paths:
            - 'src-tauri/**'
            - 'ui/**'
            - '.github/workflows/build-tauri.yml'

jobs:

    test:
        name: '🧪 Rust tests'
        runs-on: ubuntu-22.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - name: Install system libraries
              run: |
                  # retry stalled mirror downloads instead of hanging for tens of minutes
                  APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
                  sudo apt-get $APT_OPTS update
                  sudo apt-get $APT_OPTS install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev pkg-config

            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Unit tests
              working-directory: ./src-tauri
              run: cargo test --locked

            - name: Clippy
              working-directory: ./src-tauri
              run: cargo clippy --locked -- -D warnings

    build:
        name: '📦 Build ${{ matrix.label }}'
        needs: test
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { label: Linux,   os: ubuntu-22.04,  args: '' }
                    - { label: Windows, os: windows-latest, args: '' }
                    - { label: macOS,   os: macos-latest,  args: '--target universal-apple-darwin' }
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4

            - name: Install system libraries (Linux)
              if: matrix.os == 'ubuntu-22.04'
              run: |
                  # retry stalled mirror downloads instead of hanging for tens of minutes
                  APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
                  sudo apt-get $APT_OPTS update
                  sudo apt-get $APT_OPTS install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev pkg-config

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Install Tauri CLI
              run: cargo install tauri-cli --version "^2" --locked

            - name: Build bundles
              working-directory: ./src-tauri
              run: cargo tauri build ${{ matrix.args }}

            - uses: actions/upload-artifact@v4
              with:
                  name: tauri-${{ matrix.label }}
                  path: |
                      src-tauri/target/release/bundle/**/*
                      src-tauri/target/universal-apple-darwin/release/bundle/**/*
                  if-no-files-found: error
                  retention-days: 7
