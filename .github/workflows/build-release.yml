name: '📦 Build & Release'
run-name: '📦 Build & Release'

on:
    workflow_dispatch:
        inputs:
            RC_RELEASE:
                description: '🧪 Pre-release (Release Candidate)'
                required: true
                default: false
                type: boolean
            RC_VERSION:
                description: '🧪 RC suffix number (e.g. 1 → v2.2.1-rc.1)'
                required: false
                type: string
                default: '1'

env:
    PROJECT_NAME: ntfy-desktop
    RC_RELEASE:   ${{ github.event.inputs.RC_RELEASE || false }}
    RC_VERSION:   ${{ github.event.inputs.RC_VERSION || '1' }}

jobs:

    # ─────────────────────────────────────────────────────────────
    #   Get version from src/package.json
    # ─────────────────────────────────────────────────────────────

    init:
        name: '🔎 Read version'
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.ver.outputs.version }}
        steps:
            - uses: actions/checkout@v4
            - name: Read package.json version
              id: ver
              working-directory: ./src
              run: |
                  VER=$(jq -r '.version' package.json)
                  echo "version=$VER" >> "$GITHUB_OUTPUT"
                  echo "Version: $VER"

    # ─────────────────────────────────────────────────────────────
    #   Build Windows (cross-compiled on ubuntu)
    # ─────────────────────────────────────────────────────────────

    build-windows:
        name: '🪟 Build Windows'
        needs: init
        runs-on: ubuntu-latest
        env:
            VERSION: ${{ needs.init.outputs.version }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22.x'

            - name: Install dependencies
              run: |
                  mkdir -p build dist
                  cd src
                  npm ci
                  npm install -g @electron/packager

            - name: Build Windows binaries
              working-directory: ./src
              run: npm run build:lin:windows

            - name: Package ZIPs
              run: |
                  VER="${VERSION}"
                  PRJ="${PROJECT_NAME}"

                  if [ "$RC_RELEASE" = "true" ]; then
                      SUFFIX="-rc.${RC_VERSION}"
                  else
                      SUFFIX=""
                  fi

                  for ARCH in arm64 ia32 x64; do
                      LABEL=$([[ "$ARCH" == "x64" ]] && echo "amd64" || echo "$ARCH")
                      (cd build/${PRJ}-win32-${ARCH} && zip -r - .) > ${PRJ}-${VER}${SUFFIX}-win32-${LABEL}.zip
                      echo "✅ ${PRJ}-${VER}${SUFFIX}-win32-${LABEL}.zip"
                  done

            - uses: actions/upload-artifact@v4
              with:
                  name: windows-zips
                  path: '*.zip'
                  retention-days: 7

    # ─────────────────────────────────────────────────────────────
    #   Build Linux (cross-compiled on ubuntu)
    # ─────────────────────────────────────────────────────────────

    build-linux:
        name: '🐧 Build Linux'
        needs: init
        runs-on: ubuntu-latest
        env:
            VERSION: ${{ needs.init.outputs.version }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22.x'

            - name: Install dependencies
              run: |
                  mkdir -p build dist
                  cd src
                  npm ci
                  npm install -g @electron/packager

            - name: Build Linux binaries
              working-directory: ./src
              run: npm run build:lin:linux

            - name: Package ZIPs
              run: |
                  VER="${VERSION}"
                  PRJ="${PROJECT_NAME}"

                  if [ "$RC_RELEASE" = "true" ]; then
                      SUFFIX="-rc.${RC_VERSION}"
                  else
                      SUFFIX=""
                  fi

                  for ARCH in arm64 armv7l x64; do
                      LABEL=$([[ "$ARCH" == "x64" ]] && echo "amd64" || echo "$ARCH")
                      (cd build/${PRJ}-linux-${ARCH} && zip -r - .) > ${PRJ}-${VER}${SUFFIX}-linux-${LABEL}.zip
                      echo "✅ ${PRJ}-${VER}${SUFFIX}-linux-${LABEL}.zip"
                  done

            - uses: actions/upload-artifact@v4
              with:
                  name: linux-zips
                  path: '*.zip'
                  retention-days: 7

    # ─────────────────────────────────────────────────────────────
    #   Build macOS (must run on macos runner)
    # ─────────────────────────────────────────────────────────────

    build-macos:
        name: '🍎 Build macOS'
        needs: init
        runs-on: macos-latest
        env:
            VERSION: ${{ needs.init.outputs.version }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22.x'

            - name: Install dependencies
              working-directory: ./src
              run: |
                  cd ..
                  mkdir -p build dist
                  cd src
                  npm ci
                  npm install -g @electron/packager

            - name: Build macOS binaries
              working-directory: ./src
              run: npm run build:lin:mac

            - name: Package ZIPs
              run: |
                  VER="${VERSION}"
                  PRJ="${PROJECT_NAME}"

                  if [ "$RC_RELEASE" = "true" ]; then
                      SUFFIX="-rc.${RC_VERSION}"
                  else
                      SUFFIX=""
                  fi

                  for ARCH in arm64 x64; do
                      LABEL=$([[ "$ARCH" == "x64" ]] && echo "amd64" || echo "$ARCH")
                      (cd build/${PRJ}-darwin-${ARCH} && zip -r - .) > ${PRJ}-${VER}${SUFFIX}-darwin-${LABEL}.zip
                      echo "✅ ${PRJ}-${VER}${SUFFIX}-darwin-${LABEL}.zip"
                  done

            - uses: actions/upload-artifact@v4
              with:
                  name: macos-zips
                  path: '*.zip'
                  retention-days: 7

    # ─────────────────────────────────────────────────────────────
    #   Create GitHub Release
    # ─────────────────────────────────────────────────────────────

    release:
        name: '🚀 GitHub Release'
        needs: [ init, build-windows, build-linux, build-macos ]
        runs-on: ubuntu-latest
        env:
            VERSION: ${{ needs.init.outputs.version }}
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: ./artifacts
                  merge-multiple: true

            - name: Generate checksums
              run: |
                  cd artifacts
                  sha256sum *.zip > SHA256SUMS.txt
                  sha1sum   *.zip > SHA1SUMS.txt
                  echo "--- SHA256SUMS ---"
                  cat SHA256SUMS.txt

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  name: v${{ env.VERSION }}${{ env.RC_RELEASE == 'true' && format('-rc.{0}', env.RC_VERSION) || '' }}
                  tag_name: ${{ env.VERSION }}${{ env.RC_RELEASE == 'true' && format('-rc.{0}', env.RC_VERSION) || '' }}
                  draft: false
                  prerelease: ${{ env.RC_RELEASE == 'true' }}
                  generate_release_notes: true
                  files: |
                      artifacts/*.zip
                      artifacts/SHA256SUMS.txt
                      artifacts/SHA1SUMS.txt
