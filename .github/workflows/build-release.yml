name: '📦 Build & Release'
run-name: '📦 Build & Release'

on:
    workflow_dispatch:
        inputs:
            RC_RELEASE:
                description: '🧪 Pre-release (Release Candidate)'
                required: true
                default: false
                type: boolean
            RC_VERSION:
                description: '🧪 RC suffix number (e.g. 1 → v2.2.1-rc.1)'
                required: false
                type: string
                default: '1'

env:
    PROJECT_NAME: ntfy-desktop
    RC_RELEASE:   ${{ github.event.inputs.RC_RELEASE || false }}
    RC_VERSION:   ${{ github.event.inputs.RC_VERSION || '1' }}

jobs:

    # ─────────────────────────────────────────────────────────────
    #   Version from src-tauri/tauri.conf.json (must match Cargo.toml)
    # ─────────────────────────────────────────────────────────────

    init:
        name: '🔎 Read version'
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.ver.outputs.version }}
        steps:
            - uses: actions/checkout@v4
            - name: Read version
              id: ver
              run: |
                  VER=$(jq -r '.version' src-tauri/tauri.conf.json)
                  CARGO_VER=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
                  if [ "$VER" != "$CARGO_VER" ]; then
                      echo "::error::tauri.conf.json ($VER) and Cargo.toml ($CARGO_VER) versions differ"
                      exit 1
                  fi
                  echo "version=$VER" >> "$GITHUB_OUTPUT"
                  echo "Version: $VER"

    # ─────────────────────────────────────────────────────────────
    #   Rust unit tests + clippy
    # ─────────────────────────────────────────────────────────────

    test:
        name: '🧪 Rust tests'
        runs-on: ubuntu-22.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - name: Install system libraries
              run: |
                  # retry stalled mirror downloads instead of hanging for tens of minutes
                  APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
                  sudo apt-get $APT_OPTS update
                  sudo apt-get $APT_OPTS install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev pkg-config

            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Unit tests
              working-directory: ./src-tauri
              run: cargo test --locked

            - name: Clippy
              working-directory: ./src-tauri
              run: cargo clippy --locked -- -D warnings

    # ─────────────────────────────────────────────────────────────
    #   Build installers (one job per operating system)
    # ─────────────────────────────────────────────────────────────

    build:
        name: '📦 Build ${{ matrix.label }}'
        needs: [ init, test ]
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { label: windows-x64,      os: windows-latest, args: '' }
                    - { label: linux-amd64,      os: ubuntu-22.04,   args: '' }
                    - { label: macos-universal,  os: macos-latest,   args: '--target universal-apple-darwin' }
        runs-on: ${{ matrix.os }}
        timeout-minutes: 45
        env:
            VERSION: ${{ needs.init.outputs.version }}
        steps:
            - uses: actions/checkout@v4

            - name: Install system libraries (Linux)
              if: matrix.os == 'ubuntu-22.04'
              run: |
                  APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
                  sudo apt-get $APT_OPTS update
                  sudo apt-get $APT_OPTS install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev pkg-config

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Install Tauri CLI
              run: cargo install tauri-cli --version "^2" --locked

            - name: Build installers
              working-directory: ./src-tauri
              run: cargo tauri build ${{ matrix.args }}

            - name: Collect and rename installers
              shell: bash
              run: |
                  VER="${VERSION}"
                  PRJ="${PROJECT_NAME}"
                  if [ "$RC_RELEASE" = "true" ]; then SUFFIX="-rc.${RC_VERSION}"; else SUFFIX=""; fi
                  BASE="${PRJ}-${VER}${SUFFIX}-${{ matrix.label }}"

                  mkdir -p dist
                  find src-tauri/target -type d -path '*release/bundle' | while read -r B; do
                      find "$B" -type f \( -name '*-setup.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' \) | while read -r F; do
                          case "$F" in
                              *-setup.exe) EXT="-setup.exe" ;;
                              *.msi)       EXT=".msi" ;;
                              *.deb)       EXT=".deb" ;;
                              *.rpm)       EXT=".rpm" ;;
                              *.AppImage)  EXT=".AppImage" ;;
                              *.dmg)       EXT=".dmg" ;;
                          esac
                          cp "$F" "dist/${BASE}${EXT}"
                          echo "✅ dist/${BASE}${EXT}"
                      done
                  done
                  ls -l dist
                  [ -n "$(ls -A dist)" ] || { echo "::error::no installers found"; exit 1; }

            - uses: actions/upload-artifact@v4
              with:
                  name: installers-${{ matrix.label }}
                  path: dist/*
                  if-no-files-found: error
                  retention-days: 7

    # ─────────────────────────────────────────────────────────────
    #   Create GitHub Release
    # ─────────────────────────────────────────────────────────────

    release:
        name: '🚀 GitHub Release'
        needs: [ init, build ]
        runs-on: ubuntu-latest
        env:
            VERSION: ${{ needs.init.outputs.version }}
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: ./artifacts
                  merge-multiple: true

            - name: Generate checksums
              run: |
                  cd artifacts
                  sha256sum * > SHA256SUMS.txt
                  sha1sum   $(ls | grep -v SUMS) > SHA1SUMS.txt
                  echo "--- SHA256SUMS ---"
                  cat SHA256SUMS.txt

            # When a failed job is re-run the release already exists. The action would then append
            # the generated release notes to the existing text a second time, so only generate
            # them for a release that does not exist yet.
            - name: Check if the release already exists
              id: exists
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="v${VERSION}"
                  if [ "$RC_RELEASE" = "true" ]; then TAG="${TAG}-rc.${RC_VERSION}"; fi
                  if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                      echo "Release $TAG already exists; its release notes are kept as they are"
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "Release $TAG does not exist yet"
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  name: v${{ env.VERSION }}${{ env.RC_RELEASE == 'true' && format('-rc.{0}', env.RC_VERSION) || '' }}
                  tag_name: v${{ env.VERSION }}${{ env.RC_RELEASE == 'true' && format('-rc.{0}', env.RC_VERSION) || '' }}
                  draft: false
                  prerelease: ${{ env.RC_RELEASE == 'true' }}
                  generate_release_notes: ${{ steps.exists.outputs.exists != 'true' }}
                  files: |
                      artifacts/*
